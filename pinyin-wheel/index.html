<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5ef"><title>拼音魔法轮盘 · FanerArt</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span class="brandmark">拼</span> FanerArt <span class="divider">/</span><span class="small">中文游戏室</span></a><button id="fullscreen" class="quiet">⛶ <span>全屏课堂</span></button></header><main><section class="intro"><div class="eyebrow">转一转，拼一拼 ✦</div><h1>拼音魔法轮盘<span>每一次转动，都是一个新声音。</span></h1><div class="legend"><span><i class="mint"></i>外圈 · 声母</span><span><i class="peach"></i>中圈 · 韵母</span><span><i class="purple"></i>内圈 · 声调</span></div></section><div class="game"><section class="wheelzone" aria-label="拼音三圈轮盘"><div class="pointer"><span>看这里</span><b>▼</b></div><svg id="wheel" viewBox="-320 -320 640 640" role="img" aria-label="外圈声母，中圈韵母，内圈四声，顶部箭头指示抽取结果"><circle r="309" fill="#fff"/><g id="outer"></g><g id="middle"></g><g id="inner"></g><path d="M0 -301V-86" stroke="#233f3a" stroke-opacity=".2" stroke-width="2" stroke-dasharray="4 5" pointer-events="none"/><circle r="78" fill="#fffdf6" stroke="#e3e8dc" stroke-width="2"/><text y="-5" text-anchor="middle" class="centertext">拼</text><text y="27" text-anchor="middle" class="centersmall">音的奇遇</text></svg><div class="wheelcaption"><span>✦</span> 三圈一起转，一个好声音</div></section><aside class="panel"><div class="panelhead"><span class="tag">拼读挑战</span><span id="round">准备好了</span></div><h2 id="prompt">下一个声音，<br>会是什么？</h2><p class="hint" id="hint">点击旋转，等三个圈停稳。<br>看箭头，把声母、韵母和声调连起来！</p><div class="selections"><div><span>声母</span><strong id="s0">b</strong></div><b>＋</b><div><span>韵母</span><strong id="s1">a</strong></div><b>＋</b><div><span>声调</span><strong id="s2">ˉ</strong></div></div><div class="answer" aria-live="polite"><span id="answerlabel">先试着自己拼读</span><strong id="answer">?</strong><button id="reveal" class="reveal" disabled>揭晓拼音 ↗</button></div><button id="spin" class="spin"><span>✦</span> 开始旋转 <span>↻</span></button><div class="tools"><label><input id="sound" type="checkbox" checked> 转动音效</label><button id="reset" class="quiet">重新开始</button></div><p class="micro">只抽取有效拼音组合 · 四声练习</p></aside></div><section class="history"><div><h3>我们的声音足迹</h3><span id="historycount">再转一次，再认识一个声音</span></div><div id="chips"><span class="empty">第一个拼音，等你发现。</span></div></section></main><footer>FANERART · 让中文学习好玩一点 <span>按空格键也可以旋转</span></footer><script src="data.js"></script><script src="app.js"></script></body></html>
