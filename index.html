<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字破解器 · 2 Players Battle</title>
<style>
:root{--ink:#35576b;--blue:#7fa9bf;--blue2:#eaf4f8;--sage:#9aaa7a;--sage2:#f1f4df;--cream:#fbf7ee;--peach:#f4d8c8;--gold:#e6bd69;--bad:#c97d73}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#edf6f8,#fbf7ee 55%,#f2f5e4);color:var(--ink);min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0;font-size:clamp(25px,4vw,43px)} .sub{opacity:.72}.pill{background:white;border:1px solid #d9e4e5;border-radius:999px;padding:8px 14px}
.panel{background:#ffffffd9;border:1px solid #dce7e5;border-radius:26px;box-shadow:0 14px 38px #45607018;padding:20px}
.setup{max-width:760px;margin:55px auto}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:220px}label{font-weight:700;display:block;margin:10px 0 6px}
input,select{width:100%;font-size:18px;padding:12px 14px;border:1px solid #ccd9dc;border-radius:14px;background:#fff}
button{font:inherit;cursor:pointer}.primary{border:0;border-radius:16px;padding:13px 22px;background:var(--ink);color:#fff;font-weight:800;font-size:18px}
.center{text-align:center}.hidden{display:none!important}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:18px 0}
.player{padding:16px 20px;border-radius:22px;background:var(--blue2);border:2px solid #bdd5df}.player.p2{background:var(--sage2);border-color:#cbd5ad;text-align:right}
.name{font-size:21px;font-weight:850}.score{font-size:38px;font-weight:900}.meta{font-size:14px;opacity:.72}.vs{display:grid;place-items:center;font-weight:1000;font-size:24px}
.game{position:relative}.progress{height:10px;background:#e8eeec;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--sage));width:0}
.timer{font-size:18px;font-weight:800;margin:12px}.question{font-size:clamp(74px,12vw,145px);font-weight:900;line-height:1;margin:14px}
.prompt{font-weight:700;opacity:.75}.answers{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px}
.side{border-radius:24px;padding:17px}.side.left{background:#edf6fa}.side.right{background:#f3f5e7}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ans{min-height:92px;border:2px solid transparent;border-radius:18px;background:white;color:var(--ink);font-size:clamp(25px,3.2vw,42px);font-weight:850;box-shadow:0 6px 15px #3d586b12;transition:.12s}
.ans:hover{transform:translateY(-2px)}.ans:active,.flash{transform:scale(.97)}.kbd{display:block;font-size:14px;margin-top:6px;opacity:.55}
.correct{background:#dfeecd!important;border-color:#91ad67!important}.wrong{background:#f5d8d4!important;border-color:#c97d73!important}
.locked{opacity:.45;pointer-events:none}.message{height:34px;font-weight:850;font-size:20px;margin:12px}.boss{color:#9a6427}.winner{font-size:clamp(38px,6vw,72px);font-weight:1000;margin:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stat{padding:18px;border-radius:18px;background:#f5f8f6}
@media(max-width:700px){.scoreboard{grid-template-columns:1fr 45px 1fr}.answers{grid-template-columns:1fr}.player{padding:12px}.score{font-size:28px}.ans{min-height:72px}.wrap{padding:10px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>数字破解器 🔐</h1><div class="sub">Código de números chinos · 2 Players Battle</div></div><div class="pill">A S D ⚔ J K L</div></div>

<section id="setup" class="panel setup">
<h2>准备好了吗？ ¡Preparados!</h2>
<div class="row"><div class="field"><label>🔵 Jugador 1</label><input id="n1" value="Jugador 1"></div><div class="field"><label>🟢 Jugador 2</label><input id="n2" value="Jugador 2"></div></div>
<label>Nivel</label><select id="level"><option value="10">Nivel 1 · 1–10</option><option value="30">Nivel 2 · 1–30</option><option value="99" selected>Nivel 3 · 1–99</option><option value="crazy">🔥 Modo loco · 1–99 / 5 segundos</option></select>
<p>答对 <b>+100</b> ⭐　抢错 <b>−30</b>。连续答对3题开始获得 Combo 奖励。抢错后，该玩家本题锁定，另一位仍可回答。</p>
<div class="center"><button class="primary" id="start">开始比赛 · Empezar</button></div>
</section>

<section id="battle" class="hidden">
<div class="scoreboard">
<div class="player"><div class="name" id="p1name"></div><div class="score"><span id="s1">0</span> ⭐</div><div class="meta">A · S · D　🔥 <span id="c1">0</span></div></div>
<div class="vs">VS</div>
<div class="player p2"><div class="name" id="p2name"></div><div class="score"><span id="s2">0</span> ⭐</div><div class="meta">🔥 <span id="c2">0</span>　J · K · L</div></div>
</div>
<div class="panel game center">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="timer" id="timer"></div><div class="prompt" id="prompt">选择正确的中文数字 · Elige el número chino correcto</div>
<div class="question" id="q">56</div><div class="message" id="msg"></div>
<div class="answers">
<div class="side left"><div class="keys" id="left"></div></div>
<div class="side right"><div class="keys" id="right"></div></div>
</div>
</div></section>

<section id="finish" class="panel setup center hidden">
<div>🏆 FINAL</div><div class="winner" id="winner"></div><div id="finalscore"></div>
<div class="stats"><div class="stat" id="stat1"></div><div class="stat" id="stat2"></div></div>
<p><button class="primary" onclick="location.reload()">再来一局 · Revancha</button></p>
</section>
</div>
<script>
const C=["零","一","二","三","四","五","六","七","八","九"];
function cn(n){if(n<10)return C[n]; if(n===10)return"十"; let t=Math.floor(n/10),u=n%10; return (t===1?"":C[t])+"十"+(u?C[u]:"")}
let max=99,total=12,round=0,current,opts=[],active=[true,true],scores=[0,0],combo=[0,0],best=[0,0],right=[0,0],fast=[99,99],startTime,tick,timeLeft=8;
const $=id=>document.getElementById(id);
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function makeOptions(n){
 let set=new Set([n]); while(set.size<3){let d=Math.max(1,Math.min(max,n+Math.floor(Math.random()*21)-10)); if(d!==n)set.add(d)}
 return shuffle([...set]).map(x=>({n:x,txt:cn(x)}));
}
function start(){
 let lv=$("level").value; max=lv==="crazy"?99:+lv; timeLeft=lv==="crazy"?5:8; total=12;
 $("p1name").textContent=$("n1").value||"Jugador 1"; $("p2name").textContent=$("n2").value||"Jugador 2";
 $("setup").classList.add("hidden");$("battle").classList.remove("hidden");next();
}
function next(){
 clearInterval(tick); round++; if(round>total)return finish();
 active=[true,true]; $("msg").textContent=""; $("left").classList.remove("locked");$("right").classList.remove("locked");
 current=1+Math.floor(Math.random()*max); opts=makeOptions(current); $("q").textContent=current;
 renderSide("left",["A","S","D"],0);renderSide("right",["J","K","L"],1);
 $("bar").style.width=((round-1)/total*100)+"%"; startTime=performance.now();
 let limit=$("level").value==="crazy"?5:8, remain=limit; $("timer").textContent=`第 ${round}/${total} 题　⏱ ${remain}s`;
 tick=setInterval(()=>{remain--; $("timer").textContent=`第 ${round}/${total} 题　⏱ ${remain}s`; if(remain<=0){clearInterval(tick); $("msg").textContent="⏰ "+current+" = "+cn(current); setTimeout(next,1100)}},1000)
}
function renderSide(id,keys,p){
 let box=$(id);box.innerHTML=""; opts.forEach((o,i)=>{let b=document.createElement("button");b.className="ans";b.innerHTML=`${o.txt}<span class="kbd">${keys[i]}</span>`;b.onclick=()=>answer(p,i,b);box.appendChild(b)})
}
function answer(p,i,b){
 if(!active[p])return; let elapsed=(performance.now()-startTime)/1000;
 if(opts[i].n===current){
   clearInterval(tick); combo[p]++;best[p]=Math.max(best[p],combo[p]);right[p]++;fast[p]=Math.min(fast[p],elapsed);
   let bonus=combo[p]>=3?(combo[p]-2)*20:0;scores[p]+=100+bonus;b.classList.add("correct");
   $("msg").innerHTML=`✅ ${p===0?$("p1name").textContent:$("p2name").textContent} +${100+bonus} ⭐ ${bonus?"🔥 Combo!":""}`;
   active=[false,false]; update(); setTimeout(next,900);
 }else{
   scores[p]=Math.max(0,scores[p]-30);combo[p]=0;active[p]=false;b.classList.add("wrong");
   $(p===0?"left":"right").classList.add("locked"); $("msg").textContent=`❌ ${p===0?$("p1name").textContent:$("p2name").textContent} −30`;
   update(); if(!active[0]&&!active[1]){clearInterval(tick);setTimeout(next,900)}
 }
}
function update(){$("s1").textContent=scores[0];$("s2").textContent=scores[1];$("c1").textContent=combo[0];$("c2").textContent=combo[1]}
document.addEventListener("keydown",e=>{
 if($("battle").classList.contains("hidden"))return; let k=e.key.toUpperCase(), map={A:[0,0],S:[0,1],D:[0,2],J:[1,0],K:[1,1],L:[1,2]};
 if(map[k]){e.preventDefault();let [p,i]=map[k],box=$(p===0?"left":"right");let b=box.children[i]; if(b){b.classList.add("flash");setTimeout(()=>b.classList.remove("flash"),120);answer(p,i,b)}}
});
function finish(){
 clearInterval(tick);$("battle").classList.add("hidden");$("finish").classList.remove("hidden");
 let names=[$("p1name").textContent,$("p2name").textContent],w=scores[0]===scores[1]?"🤝 ¡Empate!":`🏆 ¡GANADOR! ${names[scores[1]>scores[0]?1:0]}`;
 $("winner").textContent=w;$("finalscore").textContent=`${names[0]} ${scores[0]} ⭐　—　${scores[1]} ⭐ ${names[1]}`;
 for(let p=0;p<2;p++) $(p?"stat2":"stat1").innerHTML=`<b>${names[p]}</b><br>答对 / Aciertos: ${right[p]}/${total}<br>🔥 Mejor racha: ${best[p]}<br>⚡ Más rápida: ${fast[p]===99?"—":fast[p].toFixed(2)+" s"}`;
}
$("start").onclick=start;
</script></body></html>
